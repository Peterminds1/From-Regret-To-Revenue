  <style>
    /* Premium Minimalist Dark Theme */
    :root {
      --bg-color: #12100e;
      --text-color: #e5e5e5;
      --text-muted: #a3a3a3;
      --gold: #d4af37;
      --gold-hover: #f3e5ab;
      --card-bg: #1c1917;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Manrope', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-sans); line-height: 1.6; overflow-x: hidden; }
    .wrap { width: 90%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .section { padding: 80px 0; }
    .eyebrow { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 15px; font-weight: 600; }
    h1, h2, h3 { font-family: var(--font-serif); font-weight: 600; color: #fff; line-height: 1.2; }
    
    .skip { position: absolute; left: -10000px; top: auto; width: 1px; height: 1px; overflow: hidden; }
    .skip:focus { position: static; width: auto; height: auto; background: var(--gold); color: #000; padding: 10px; }

    /* Navigation styling */
    .nav { padding: 20px 0; border-bottom: 1px solid #26221f; position: sticky; top: 0; background: rgba(18, 16, 14, 0.9); backdrop-filter: blur(10px); z-index: 100; }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: var(--font-serif); font-size: 1.5rem; color: #fff; text-decoration: none; font-weight: bold; }
    .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 25px; font-size: 0.95rem; transition: color 0.3s; }
    .nav-links a:hover { color: #fff; }

    /* Button and UI element variations */
    .btn { display: inline-block; padding: 12px 28px; border-radius: 4px; font-weight: 600; text-decoration: none; transition: transform 0.2s, background-color 0.3s; border: none; cursor: pointer; font-size: 0.95rem; text-align: center; }
    .btn-gold { background-color: var(--gold); color: #000; }
    .btn-gold:hover { background-color: var(--gold-hover); transform: translateY(-2px); }
    .link-quiet { color: var(--gold); text-decoration: underline; font-size: 0.95rem; display: inline-block; margin-top: 10px; }
    .price-under { font-size: 0.9rem; color: var(--text-muted); margin-top: 10px; }

    /* Hero section style rules */
    .hero { padding: 100px 0 80px; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 60px; align-items: center; }
    .hero h1 { font-size: 3.5rem; margin-bottom: 20px; }
    .h1-rest { display: block; color: var(--text-muted); font-size: 2.5rem; font-style: italic; }
    .hero-lead { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; max-width: 600px; }
    .journey { display: flex; align-items: center; gap: 12px; margin-top: 40px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .journey i { color: var(--gold); font-style: normal; }

    /* 3D Animated Book Layout Component */
    .book-stage { display: flex; justify-content: center; perspective: 1000px; }
    .book-3d { position: relative; width: 320px; height: 480px; transform: rotateY(-20px) rotateX(10px); transform-style: preserve-3d; box-shadow: 20px 20px 40px rgba(0,0,0,0.6); transition: transform 0.5s; }
    .book-3d:hover { transform: rotateY(-10px) rotateX(5px); }
    .book-face { position: absolute; width: 100%; height: 100%; left: 0; top: 0; background: #26221f; border-radius: 2px 4px 4px 2px; overflow: hidden; }
    .book-face img { width: 100%; height: 100%; object-fit: cover; }
    .book-spine { position: absolute; width: 40px; height: 100%; left: -40px; top: 0; background: #1a1715; transform: rotateY(-90px); transform-origin: right; box-shadow: inset -4px 0 10px rgba(0,0,0,0.5); }
    .book-pages { position: absolute; width: 35px; height: 98%; right: -33px; top: 1%; background: #eee; transform: rotateY(90px); transform-origin: left; box-shadow: inset 4px 0 10px rgba(0,0,0,0.2); background-image: linear-gradient(90deg, #ccc 1px, transparent 1px); background-size: 3px 100%; }

    /* Thoughts Block Component */
    .hook { background-color: var(--card-bg); text-align: center; border-bottom: 1px solid #26221f; border-top: 1px solid #26221f; }
    .thoughts { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 40px 0; max-width: 800px; margin-left: auto; margin-right: auto; }
    .thought { font-family: var(--font-serif); font-size: 1.4rem; font-style: italic; color: var(--text-muted); padding: 10px 20px; border-left: 2px solid var(--gold); background: rgba(255,255,255,0.02); }
    .turn { margin-top: 40px; max-width: 700px; margin-left: auto; margin-right: auto; }
    .turn h3 { font-size: 2.2rem; margin-bottom: 15px; color: #fff; }
    .turn p { font-size: 1.2rem; color: var(--text-muted); }

    /* Story Grid rules */
    .story-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 60px; }
    .story h2 { font-size: 2.8rem; }
    .story-copy p { margin-bottom: 20px; font-size: 1.1rem; color: var(--text-muted); }
    .quote-block { border-left: 3px solid var(--gold); padding-left: 20px; margin: 30px 0; font-family: var(--font-serif); font-size: 1.5rem; color: #fff; line-height: 1.4; }
    .gold.closer { color: var(--gold); font-family: var(--font-serif); font-size: 1.6rem; font-weight: 600; margin: 35px 0 15px; }
    .story-bridge { font-weight: bold; color: #fff; }

    /* Founder profile block layout rules */
    .founder { background-color: var(--card-bg); }
    .founder-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 60px; align-items: center; }
    .founder-photo img { width: 100%; max-width: 450px; border-radius: 6px; box-shadow: 10px 10px 30px rgba(0,0,0,0.5); object-fit: cover; }
    .founder h2 { font-size: 2.8rem; margin-bottom: 5px; }
    .author-line { color: var(--gold); font-size: 1rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
    .founder p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 20px; }

    /* Big Idea Feature Grid style rules */
    .idea-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-top: 40px; }
    .idea-card { background: var(--card-bg); border: 1px solid #26221f; padding: 30px; border-radius: 6px; }
    .idea-card h3 { font-size: 1.5rem; margin-bottom: 10px; color: var(--gold); }
    .idea-card p { color: var(--text-muted); font-size: 1rem; }

    /* Discover Chapters Grid block */
    .discover-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 40px; }
    .discover-card { background: rgba(255,255,255,0.01); border: 1px solid #26221f; padding: 30px; border-radius: 6px; }
    .discover-card h3 { font-size: 1.3rem; margin-bottom: 12px; margin-top: 5px; }
    .discover-card p { color: var(--text-muted); font-size: 0.95rem; }
    .discover-card .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; font-size: 0.8rem; color: var(--gold); }

    /* Target Avatars section layout formatting rules */
    .who-section { background-color: var(--card-bg); text-align: center; }
    .who-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; text-align: left; }
    .who-card { border-top: 2px solid var(--gold); background: var(--bg-color); padding: 30px; border-radius: 0 0 6px 6px; }
    .who-card .num { font-size: 1.5rem; font-weight: bold; color: var(--gold); margin-bottom: 15px; font-family: var(--font-serif); }
    .who-card h3 { font-size: 1.3rem; margin-bottom: 10px; }
    .who-card p { color: var(--text-muted); font-style: italic; }

    /* Comprehensive FAQ formatting system rules */
    .faq { border-top: 1px solid #26221f; background: #12100e; }
    .faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
    .faq-item { background: var(--card-bg); padding: 25px; border-radius: 6px; border: 1px solid #26221f; }
